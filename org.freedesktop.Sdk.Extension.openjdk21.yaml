id: org.freedesktop.Sdk.Extension.openjdk21
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
build-extension: true
sdk: org.freedesktop.Sdk
separate-locales: false
cleanup:
  - /share/info
  - /share/man
build-options:
  no-debuginfo: true
  strip: true
  prefix: /usr/lib/sdk/openjdk21
  env:
    V: '1'
modules:
  - name: bootstrap_jdk
    buildsystem: simple
    cleanup:
      - '*'
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.9%2B10/OpenJDK21U-jdk_x64_linux_hotspot_21.0.9_10.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: 5209bc15c2c21372b32b8ed55f03aef91e400d151dcfdfab83d63569c12b13aeee7b9c1678c960797d47962396ca566ebed791f55fcef4f27a9450c0db0b4035
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.9%2B10/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.9_10.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: f0eec66822af2060c541ca7ebe6d3e0ad532a4937096df0a746d74ff2c4c94a4171fdfaee12b40f42a633f1bf87c9f353dfcbec91a3a34f17ded3c98bc1f3de8
    build-commands:
      - mkdir -p $FLATPAK_DEST/bootstrap-java
      - tar xf java-openjdk.tar.bz2 --strip-components=1 --directory=$FLATPAK_DEST/bootstrap-java

  - name: java
    buildsystem: simple
    build-commands:
      - |
        bash configure \
           --with-boot-jdk=/usr/lib/sdk/openjdk21/bootstrap-java \
           --with-jvm-variants=server \
           --with-version-pre= \
           --with-version-opt= \
           --with-vendor-version-string=25.08 \
           --with-vendor-name=Flathub \
           --with-vendor-url=https://flathub.org \
           --with-vendor-bug-url=https://github.com/flathub/org.freedesktop.Sdk.Extension.openjdk21/issues \
           --with-vendor-vm-bug-url=https://github.com/flathub/org.freedesktop.Sdk.Extension.openjdk21/issues \
           --with-debug-level=release \
           --with-native-debug-symbols=internal \
           --enable-unlimited-crypto \
           --with-zlib=system \
           --with-libjpeg=system \
           --with-giflib=system \
           --with-libpng=system \
           --with-lcms=system \
           --with-harfbuzz=system \
           --with-stdc++lib=dynamic \
           --with-extra-cflags="${CFLAGS}" \
           --with-extra-cxxflags="${CXXFLAGS}" \
           --with-extra-ldflags="${LDFLAGS}" \
           --disable-javac-server \
           --disable-warnings-as-errors
      - make -j1 LOG=info images
      - mkdir -p $FLATPAK_DEST/jvm $FLATPAK_DEST/bin
      - cp -Lr build/linux-*-server-release/images/jdk $FLATPAK_DEST/jvm/openjdk-21
      - ln -sr $FLATPAK_DEST/jvm/openjdk-21/bin/* $FLATPAK_DEST/bin
    sources:
      - type: archive
        url: https://github.com/openjdk/jdk21u/archive/refs/tags/jdk-21.0.10+7.tar.gz
        sha512: 3b74555e77bc0810a96b21f6e891d6d0b15fefefe8dc6ab317b5ba7dbf74f876b1cff430e307dee826fd53c85e99126cdbfa39ec295c9aa618d5ccd36368ef64
        x-checker-data:
          type: json
          url: https://api.adoptium.net/v3/assets/latest/21/hotspot?os=linux&architecture=x64&image_type=jdk
          version-query: .[0].release_name
          url-query: '"https://github.com/openjdk/jdk21u/archive/refs/tags/" + $version
            + ".tar.gz"'
          versions:
            - ==: 21
          is-main-source: true
      - type: patch
        paths:
          - patches/0001-Allow-ccache-to-be-handled-by-GCC-wrappers.patch
          - patches/0002-FORBID_C_FUNCTION-needs-exception-spec-consistent-wi.patch
          - patches/0003-Fix-missing-inline-includes-for-XList-and-ZList-dest.patch

  - name: cacerts
    buildsystem: simple
    sources:
      - type: file
        path: extract_cacerts.sh
    build-commands:
      - ./extract_cacerts.sh $FLATPAK_DEST/jvm/openjdk-21
  - name: ant
    buildsystem: simple
    cleanup:
      - '*.bat'
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/ant/binaries/apache-ant-1.10.16-bin.tar.gz
        dest-filename: apache-ant-bin.tar.gz
        sha512: b711c0a88751efdbcc33d55b1c054b741e5e75c603c1a1b7ed39bb62f0b1fa562cd2e6232d9fb5dd8ab165169fde35a4e4be567925ab9aa84bc668ac54077be7
        x-checker-data:
          type: anitya
          project-id: 50
          stable-only: true
          url-template: http://archive.apache.org/dist/ant/binaries/apache-ant-$version-bin.tar.gz
    build-commands:
      - mkdir -p $FLATPAK_DEST/ant
      - tar xf apache-ant-bin.tar.gz --strip-components=1 --directory=$FLATPAK_DEST/ant
      - ln -s $FLATPAK_DEST/ant/bin/ant $FLATPAK_DEST/bin
  - name: maven
    buildsystem: simple
    cleanup:
      - '*.bat'
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz
        dest-filename: apache-maven-bin.tar.gz
        sha512: d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8
        x-checker-data:
          type: anitya
          project-id: 1894
          stable-only: true
          url-template: http://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.tar.gz
    build-commands:
      - mkdir -p $FLATPAK_DEST/maven
      - tar xf apache-maven-bin.tar.gz --strip-components=1 --exclude=jansi-native
        --directory=$FLATPAK_DEST/maven
      - ln -s $FLATPAK_DEST/maven/bin/mvn $FLATPAK_DEST/maven/bin/mvnDebug $FLATPAK_DEST/bin
  - name: gradle
    buildsystem: simple
    cleanup:
      - '*.bat'
    sources:
      - type: file
        url: https://services.gradle.org/distributions/gradle-9.4.1-bin.zip
        dest-filename: gradle-bin.zip
        sha512: 7aa7b84d6194c3d343c3c60a2c81d9f2aabf8c7ee0cc6b4330e9e4059a0b58762993feb9a5d95efe004aedfc0cf06c8faced4056bd2b8d47bdea4c34ce6f31f8
        x-checker-data:
          type: json
          url: https://api.github.com/repos/gradle/gradle/releases
          version-query: map(select(.prerelease == false)) | sort_by(.name) | last
            | .name
          url-query: '["https://services.gradle.org/distributions/gradle-" + $version
            + "-bin.zip"][0]'
    build-commands:
      - unzip -q gradle-bin.zip -d $FLATPAK_DEST
      - mv $FLATPAK_DEST/gradle-* $FLATPAK_DEST/gradle
      - ln -s $FLATPAK_DEST/gradle/bin/gradle $FLATPAK_DEST/bin
  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - mkdir -p /app/jre/bin
          - cd /usr/lib/sdk/openjdk21/jvm/openjdk-21
          - cp -ra conf lib release /app/jre/
          - rm /app/jre/lib/src.zip /app/jre/lib/ct.sym
          - cp -ra bin/{java,keytool,rmiregistry} /app/jre/bin
        dest-filename: install.sh
      - type: script
        commands:
          - mkdir -p /app/jdk/
          - cd /usr/lib/sdk/openjdk21/jvm/openjdk-21
          - cp -ra bin conf include jmods lib release /app/jdk/
        dest-filename: installjdk.sh
      - type: script
        commands:
          - export JAVA_HOME=/usr/lib/sdk/openjdk21/jvm/openjdk-21
          - export PATH=$PATH:/usr/lib/sdk/openjdk21/bin
        dest-filename: enable.sh
    build-commands:
      - cp enable.sh install.sh installjdk.sh /usr/lib/sdk/openjdk21/
  - name: appdata
    buildsystem: simple
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk21.appdata.xml
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/metainfo
      - cp org.freedesktop.Sdk.Extension.openjdk21.appdata.xml ${FLATPAK_DEST}/share/metainfo
